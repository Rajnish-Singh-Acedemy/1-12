<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | RDX Singh Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body class="bg-gray-100 font-sans">

<nav class="bg-blue-600 p-4 flex justify-between text-white">
    <h1 class="text-xl font-bold">RDX Singh Academy</h1>
    <button onclick="logout()" class="bg-red-500 px-4 py-1 rounded">Logout</button>
</nav>

<div class="max-w-4xl mx-auto mt-6 px-4 pb-20">

    <div class="bg-white p-6 rounded mb-6">
        <h2 class="text-2xl font-bold" id="welcomeMsg">Namaste Student!</h2>
        <p>Aapne <span id="classNameDisplay">...</span> ke liye login kiya hai.</p>
    </div>

    <div id="liveClassSection" class="hidden mb-6">
        <a id="liveMeetLink" href="#" target="_blank"
           class="block bg-red-600 text-white text-center p-3 rounded font-bold animate-pulse">
           🔴 Join Live Class
        </a>
    </div>

    <div id="loader" class="text-center py-10">Loading...</div>

    <div id="subjectSection" class="hidden mb-6">
        <h3 class="text-lg font-bold mb-4" id="sectionHeading">Subjects:</h3>
        <div id="subjectsList" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>

    <div id="contentDisplay" class="hidden bg-white p-6 rounded">
        <button onclick="goBackToChapters()">⬅ Back</button>
        <h3 id="chapterTitle" class="text-xl font-bold mb-4"></h3>

        <iframe id="videoPlayer" width="100%" height="300"></iframe>

        <a id="notesLink" href="#" target="_blank"
           class="block mt-4 bg-green-600 text-white text-center p-2 rounded">
           Download Notes
        </a>
    </div>

    <div id="paymentSection" class="hidden text-center bg-blue-100 p-6 rounded">
        <h3 class="text-xl font-bold">Course Locked</h3>
        <button onclick="payWithRazorpay()" class="bg-blue-600 text-white px-6 py-2 mt-4 rounded">
            Pay Now
        </button>
    </div>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "rdx-singh-acedemy.firebaseapp.com",
    projectId: "rdx-singh-acedemy"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// ✅ SUBJECT MAPPING FIX
const classSubjects = {
    "Class-1": ["Maths", "English", "Hindi", "EVS"],
    "Class-2": ["Maths", "English", "Hindi", "GK"],
    "Class-3": ["Maths", "Science", "Social Science", "English"],
    "Accounting": ["GST", "Income Tax", "Tally Prime", "Auditing"]
};

let currentClass = "";
let currentSubject = "";

// ✅ SINGLE AUTH LISTENER
auth.onAuthStateChanged(async (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    try {
        const doc = await db.collection("students").doc(user.uid).get();

        if (!doc.exists) {
            alert("Student data not found");
            return;
        }

        const data = doc.data();

        // 🔥 MAIN FIX
        currentClass = (data.course || "").trim();

        if (!currentClass) {
            alert("Course missing in DB");
            return;
        }

        document.getElementById("loader").style.display = "none";
        document.getElementById("welcomeMsg").innerText =
            "Namaste " + (data.name || "Student");
        document.getElementById("classNameDisplay").innerText = currentClass;

        displaySubjects(currentClass);

        // ✅ LIVE CLASS
        if (data.isPaid && data.liveLink) {
            document.getElementById("liveClassSection").classList.remove("hidden");
            document.getElementById("liveMeetLink").href = data.liveLink;
        }

        // ✅ PAYMENT LOCK
        if (!data.isPaid) {
            document.getElementById("paymentSection").classList.remove("hidden");
            document.getElementById("subjectsList").classList.add("opacity-50","pointer-events-none");
        }

    } catch (err) {
        console.error(err);
    }
});

// ✅ SUBJECT SHOW
function displaySubjects(className) {
    const subjects = classSubjects[className];
    const list = document.getElementById("subjectsList");

    document.getElementById("subjectSection").classList.remove("hidden");

    if (!subjects) {
        list.innerHTML = `<p>No subjects found</p>`;
        return;
    }

    list.innerHTML = "";

    subjects.forEach(sub => {
        list.innerHTML += `
            <div onclick="loadChapters('${sub}')"
                 class="bg-white p-4 text-center cursor-pointer shadow hover:bg-blue-100">
                ${sub}
            </div>
        `;
    });
}

// ✅ LOAD CHAPTERS
async function loadChapters(subjectName) {
    currentSubject = subjectName;
    const list = document.getElementById("subjectsList");

    list.innerHTML = "Loading...";

    const snapshot = await db.collection("content")
        .doc(currentClass)
        .collection("Subjects")
        .doc(subjectName)
        .collection("Chapters")
        .get();

    list.innerHTML = "";

    snapshot.forEach(doc => {
        const chap = doc.data();

        list.innerHTML += `
            <div onclick="openChapter('${doc.id}','${chap.videoUrl}','${chap.notesUrl}')"
                 class="bg-blue-100 p-3 cursor-pointer">
                ${chap.title || doc.id}
            </div>
        `;
    });
}

// ✅ OPEN CHAPTER
function openChapter(title, video, notes) {
    document.getElementById("subjectSection").classList.add("hidden");
    document.getElementById("contentDisplay").classList.remove("hidden");

    document.getElementById("chapterTitle").innerText = title;
    document.getElementById("videoPlayer").src = video;
    document.getElementById("notesLink").href = notes;
}

// BACK
function goBackToChapters() {
    document.getElementById("contentDisplay").classList.add("hidden");
    document.getElementById("subjectSection").classList.remove("hidden");
}

// PAYMENT
function payWithRazorpay() {
    alert("Integrate Razorpay here");
}

// LOGOUT
function logout() {
    auth.signOut().then(() => {
        window.location.href = "login.html";
    });
}
</script>

</body>
</html>
