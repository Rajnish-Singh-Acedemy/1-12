<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-700 p-4 text-white shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">RDX Singh Academy</h1>
            <button id="logoutBtn" class="bg-red-500 px-4 py-2 rounded text-sm">Logout</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto py-10 px-4">
    <div class="mb-8 bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-2xl font-bold text-gray-800">Namaste, <span id="studentName">Student</span>!</h2>
        <p id="classInfo" class="text-blue-600 font-medium">Loading...</p>
    </div>

    <div id="breadcrumb" class="mb-6 flex items-center gap-4 hidden">
        <button onclick="goBack()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-bold">← Back</button>
        <h3 id="currentViewTitle" class="text-xl font-bold text-gray-700">Subjects</h3>
    </div>

    <div id="displayGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoflPLOwZ6Ol8FgmCiIMx4Lgn-qSap4Ps",
            authDomain: "rdx-singh-acedemy.firebaseapp.com",
            projectId: "rdx-singh-acedemy",
            storageBucket: "rdx-singh-acedemy.firebasestorage.app",
            messagingSenderId: "833608207106",
            appId: "1:833608207106:web:88c09aee29ed5eff28101b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Check Authentication State
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loadUserData(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        // Load Student Profile and Payment Status
        async function loadUserData(uid) {
            const userRef = doc(db, "students", uid);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                const data = userSnap.data();
                document.getElementById('studentName').innerText = data.name;
                document.getElementById('classInfo').innerText = `Course: ${data.class}`;

                if (data.isPaid === true) {
                    document.getElementById('courseContent').classList.remove('hidden');
                    loadCourseContent(data.class);
                } else {
                    document.getElementById('paymentSection').classList.remove('hidden');
                }
            }
        }

        // Razorpay Integration
        document.getElementById('payNowBtn').onclick = function() {
            var options = {
                "key": "rzp_test_SZlBfxFaDKpW25", // Aapki Test API Key
                "amount": 49900, // Paise mein (499 * 100)
                "name": "RDX Singh Academy",
                "description": "Class 1 Course Fee",
                "handler": async function (response) {
                    // Payment Success hone par Firestore update karein
                    const userRef = doc(db, "students", currentUser.uid);
                    await updateDoc(userRef, {
                        isPaid: true,
                        paymentID: response.razorpay_payment_id
                    });
                    alert("Payment Successful! Course Activated.");
                    location.reload(); // Refresh to show content
                },
                "prefill": {
                    "email": currentUser.email
                },
                "theme": { "color": "#2563eb" }
            };
            var rzp1 = new Razorpay(options);
            rzp1.open();
        };

        // Load Subjects and Videos from Firestore
        async function loadCourseContent(className) {
            const subjectsGrid = document.getElementById('subjectsGrid');
            // Hum ek collection dhundhenge jo "subjects" ke naam se ho
            const subRef = collection(db, "classes", className, "subjects");
            const querySnapshot = await getDocs(subRef);

            querySnapshot.forEach((doc) => {
                const sub = doc.data();
                const card = `
                    <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition cursor-pointer border-t-4 border-blue-600" 
                         onclick="playVideo('${sub.videoLink}', '${sub.title}')">
                        <div class="text-4xl mb-3">📚</div>
                        <h4 class="text-xl font-bold">${sub.title}</h4>
                        <p class="text-gray-500 text-sm mt-2">Chapter-wise Videos Available</p>
                        <button class="mt-4 text-blue-600 font-semibold">Start Learning →</button>
                    </div>
                `;
                subjectsGrid.innerHTML += card;
            });
        }

        // Global functions for Video Modal
        window.playVideo = function(link, title) {
            // YouTube link ko embed format mein badalna zaroori hai
            let embedUrl = link.replace("watch?v=", "embed/");
            document.getElementById('videoFrame').src = embedUrl;
            document.getElementById('videoTitle').innerText = title;
            document.getElementById('videoModal').classList.remove('hidden');
        }

        window.closeVideo = function() {
            document.getElementById('videoModal').classList.add('hidden');
            document.getElementById('videoFrame').src = "";
        }

        // Logout
        document.getElementById('logoutBtn').onclick = () => signOut(auth);
    </script>
</body>
</html>
