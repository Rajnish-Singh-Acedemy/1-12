<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-blue-600 shadow-md p-4 flex justify-between items-center text-white sticky top-0 z-50">
        <h1 class="text-xl font-bold">RDX Singh Academy</h1>
        <button onclick="logout()" class="bg-red-500 px-4 py-1 rounded-lg text-sm font-medium hover:bg-red-600 transition">Logout</button>
    </nav>

    <div class="max-w-4xl mx-auto mt-6 px-4 pb-20">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6">
            <h2 class="text-2xl font-bold text-gray-800" id="welcomeMsg">Namaste Student!</h2>
            <p class="text-gray-500" id="courseInfo">Aapne <span class="font-bold text-blue-600" id="classNameDisplay">...</span> ke liye login kiya hai.</p>
        </div>

        <div id="liveClassSection" class="hidden mb-6">
            <a id="liveMeetLink" href="#" target="_blank" class="block bg-red-600 text-white text-center p-3 rounded-xl font-bold animate-pulse hover:bg-red-700 transition shadow-lg">
                🔴 Join Live Class (Click to Join)
            </a>
        </div>

        <div id="loader" class="text-center py-20 text-gray-500 flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-2"></div>
            <p>Account details check ho rahi hain...</p>
        </div>

        <div id="subjectSection" class="hidden mb-10">
            <h3 class="text-lg font-bold mb-4 text-gray-700" id="sectionHeading">Aapke Subjects:</h3>
            <div id="subjectsList" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                </div>
        </div>

        <div id="contentDisplay" class="hidden mt-6 bg-white p-6 rounded-2xl shadow-md border-t-4 border-blue-600">
            <button onclick="goBackToChapters()" class="text-blue-600 font-bold mb-4 flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                Back to Chapters
            </button>
            <h3 id="chapterTitle" class="text-xl font-bold mb-4 text-gray-800">Chapter Title</h3>
            
            <div class="aspect-video bg-black rounded-xl overflow-hidden mb-6 shadow-inner">
                <iframe id="videoPlayer" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <a id="notesLink" href="#" target="_blank" class="flex-1 bg-green-600 text-white text-center py-3 rounded-xl font-bold hover:bg-green-700 shadow-md">
                    📖 Download PDF Notes
                </a>
            </div>
        </div>

        <div id="paymentSection" class="hidden bg-blue-50 border border-blue-100 p-8 rounded-2xl text-center">
            <div class="mb-4 inline-block p-4 bg-blue-100 rounded-full">
                <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-800">Course Access Locked</h3>
            <p class="text-gray-600 mt-2 mb-6">Padhai shuru karne ke liye fees jama karein.</p>
            <button onclick="payWithRazorpay()" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold hover:bg-blue-700 transition transform hover:scale-105 shadow-lg">
                Pay Fees & Unlock Course
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoflPLOwZ6Ol8FgmCiIMx4Lgn-qSap4Ps",
            authDomain: "rdx-singh-acedemy.firebaseapp.com",
            projectId: "rdx-singh-acedemy",
            storageBucket: "rdx-singh-acedemy.firebasestorage.app",
            messagingSenderId: "833608207106",
            appId: "1:833608207106:web:88c09aee29ed5eff28101b"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Subjects Mapping
        const classSubjects = {
            "Class-1": ["Maths", "English", "Hindi", "EVS"],
            "Class-2": ["Maths", "English", "Hindi", "GK"],
            "Class-10": ["Maths", "Science", "Social Science", "English"],
            "Accounting": ["GST", "Income Tax", "Tally Prime", "Auditing"]
        };

        let currentClass = "";
        let currentSubject = "";

        auth.onAuthStateChanged((user) => {
    if (user) {
        db.collection("students").doc(user.uid).get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                
                // Debugging ke liye console check karein
                console.log("Student Class from DB:", data.class);
                
                // Firestore se aane wali exact value use karein
                currentClass = data.class; 

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('welcomeMsg').innerText = "Namaste " + (data.name || "Student") + "!";
                document.getElementById('classNameDisplay').innerText = currentClass;

                // Subjects dikhane wali function
                displaySubjects(currentClass);

                        // Check Live Link
                        if (data.isPaid && data.liveLink) {
                            document.getElementById('liveClassSection').classList.remove('hidden');
                            document.getElementById('liveMeetLink').href = data.liveLink;
                        }

                        // Show Subjects
                        displaySubjects(currentClass);

                        if (data.isPaid) {
                            document.getElementById('paymentSection').classList.add('hidden');
                        } else {
                            document.getElementById('paymentSection').classList.remove('hidden');
                            document.getElementById('subjectsList').classList.add('opacity-50', 'pointer-events-none');
                        }
                    }
                }).catch(err => {
                    console.error(err);
                    document.getElementById('loader').innerText = "Data fetch error.";
                });
            } else {
                window.location.href = "login.html";
            }
        });

        function displaySubjects(className) {
            const list = document.getElementById('subjectsList');
            const section = document.getElementById('subjectSection');
            document.getElementById('sectionHeading').innerText = "Aapke Subjects:";
            document.getElementById('contentDisplay').classList.add('hidden');
            section.classList.remove('hidden');

            const subjects = classSubjects[className] || ["General Study"];
            
            list.innerHTML = ""; 
            subjects.forEach(sub => {
                list.innerHTML += `
                    <div onclick="loadChapters('${sub}')" class="bg-white p-6 rounded-xl shadow-sm border border-blue-100 text-center font-bold text-blue-600 cursor-pointer hover:bg-blue-50 hover:border-blue-500 transition shadow-md">
                        ${sub}
                    </div>
                `;
            });
        }

        async function loadChapters(subjectName) {
            currentSubject = subjectName;
            const list = document.getElementById('subjectsList');
            document.getElementById('sectionHeading').innerText = `${subjectName} - Chapters:`;
            list.innerHTML = `<p class="col-span-full text-center">Chapters load ho rahe hain...</p>`;

            try {
                // Fetch from: content -> [Class] -> Subjects -> [Subject] -> Chapters
                const snapshot = await db.collection("content").doc(currentClass)
                                         .collection("Subjects").doc(subjectName)
                                         .collection("Chapters").get();
                
                list.innerHTML = "";
                if (snapshot.empty) {
                    list.innerHTML = `<p class="col-span-full text-center text-gray-400">Jald hi chapters add kiye jayenge.</p>`;
                }

                snapshot.forEach(doc => {
                    const chap = doc.data();
                    list.innerHTML += `
                        <div onclick="openChapter('${doc.id}', '${chap.videoUrl}', '${chap.notesUrl}')" class="bg-blue-50 p-4 rounded-xl border border-blue-200 cursor-pointer hover:bg-blue-100 transition shadow-sm">
                            <span class="font-bold text-blue-800">${chap.title || doc.id}</span>
                            <p class="text-xs text-blue-500 mt-1">Study Now →</p>
                        </div>
                    `;
                });

                list.innerHTML += `<div class="col-span-full mt-4 text-center"><button onclick="displaySubjects('${currentClass}')" class="text-sm underline text-gray-500">← Back to Subjects</button></div>`;
            } catch (e) {
                console.error(e);
            }
        }

        function openChapter(title, video, notes) {
            document.getElementById('subjectSection').classList.add('hidden');
            document.getElementById('contentDisplay').classList.remove('hidden');
            document.getElementById('chapterTitle').innerText = title;
            document.getElementById('videoPlayer').src = video;
            document.getElementById('notesLink').href = notes;
        }

        function goBackToChapters() {
            document.getElementById('contentDisplay').classList.add('hidden');
            document.getElementById('subjectSection').classList.remove('hidden');
            document.getElementById('videoPlayer').src = "";
        }

        function payWithRazorpay() {
            alert("Razorpay payment gateway integrate karein.");
        }

        function logout() {
            auth.signOut().then(() => { window.location.href = "login.html"; });
        }
    </script>
</body>
</html>
