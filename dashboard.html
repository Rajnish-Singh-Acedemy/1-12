<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-700 p-4 text-white shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">RDX Singh Academy</h1>
            <button id="logoutBtn" class="bg-red-500 px-4 py-2 rounded text-sm hover:bg-red-600 transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto py-10 px-4">
        <div class="mb-8 bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-2xl font-bold text-gray-800">Namaste, <span id="studentName">Student</span>!</h2>
            <p id="classInfo" class="text-blue-600 font-medium">Connecting to server...</p>
        </div>

        <div id="breadcrumb" class="mb-6 flex items-center gap-4 hidden">
            <button id="backBtn" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-bold transition">← Back to Subjects</button>
            <h3 id="currentViewTitle" class="text-xl font-bold text-gray-700">Subjects</h3>
        </div>

        <div id="displayGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p id="loadingMsg" class="text-gray-500">Loading your content...</p>
        </div>

        <div id="paymentSection" class="hidden bg-yellow-50 border-2 border-yellow-200 p-8 rounded-2xl text-center shadow-lg my-10">
            <h3 class="text-2xl font-bold text-gray-800 mb-2">Activate Your Course</h3>
            <p class="text-gray-600 mb-6">Aapne abhi tak subscription pay nahi kiya hai. Access ke liye payment karein.</p>
            <div class="bg-white inline-block px-8 py-4 rounded-xl shadow-inner mb-6">
                <span class="text-gray-500 block">Total Amount</span>
                <span class="text-4xl font-black text-green-600">₹499</span>
            </div>
            <br>
            <button id="payNowBtn" class="bg-blue-600 text-white font-bold px-12 py-4 rounded-full hover:bg-blue-700 transition transform hover:scale-105 shadow-xl">
                Pay with Razorpay
            </button>
        </div>

        <div id="videoModal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex flex-col items-center justify-center p-4">
            <button id="closeVideoBtn" class="absolute top-5 right-5 text-white text-4xl hover:text-red-500 transition">&times;</button>
            <div class="w-full max-w-4xl aspect-video bg-black shadow-2xl">
                <iframe id="videoFrame" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <h4 id="videoTitle" class="text-white mt-4 text-xl font-bold text-center">Video Title</h4>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoflPLOwZ6Ol8FgmCiIMx4Lgn-qSap4Ps",
            authDomain: "rdx-singh-acedemy.firebaseapp.com",
            projectId: "rdx-singh-acedemy",
            storageBucket: "rdx-singh-acedemy.firebasestorage.app",
            messagingSenderId: "833608207106",
            appId: "1:833608207106:web:88c09aee29ed5eff28101b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentClass = "";

        // 1. Auth State Checker
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loadUserData(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        // 2. Profile Loader
        async function loadUserData(uid) {
            try {
                const userRef = doc(db, "students", uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    currentClass = data.class;
                    document.getElementById('studentName').innerText = data.name;
                    document.getElementById('classInfo').innerText = `Course: ${data.class}`;

                    if (data.isPaid === true) {
                        loadSubjects(data.class);
                    } else {
                        document.getElementById('loadingMsg').classList.add('hidden');
                        document.getElementById('paymentSection').classList.remove('hidden');
                    }
                }
            } catch (error) {
                console.error("Error loading user data:", error);
            }
        }

        // 3. Load Subjects List
        async function loadSubjects(className) {
            const grid = document.getElementById('displayGrid');
            const breadcrumb = document.getElementById('breadcrumb');
            grid.innerHTML = "<p class='text-blue-600'>Loading Subjects...</p>";
            breadcrumb.classList.add('hidden');

            try {
                const subRef = collection(db, "classes", className, "subjects");
                const snap = await getDocs(subRef);

                grid.innerHTML = "";
                if (snap.empty) {
                    grid.innerHTML = "<p class='text-red-500'>No subjects found for this class.</p>";
                    return;
                }

                snap.forEach((doc) => {
                    const subName = doc.id; 
                    grid.innerHTML += `
                        <div onclick="window.loadChapters('${subName}')" class="bg-white p-8 rounded-2xl shadow-md border-b-4 border-blue-600 hover:scale-105 transition cursor-pointer text-center group">
                            <div class="text-5xl mb-4 group-hover:animate-bounce">📚</div>
                            <h4 class="text-xl font-black text-gray-800">${subName}</h4>
                            <p class="text-blue-500 mt-2 font-semibold">View Chapters →</p>
                        </div>`;
                });
            } catch (error) {
                grid.innerHTML = "<p class='text-red-500'>Error loading subjects.</p>";
            }
        }

        // 4. Load Chapters for selected Subject
        window.loadChapters = async function(subjectID) {
            const grid = document.getElementById('displayGrid');
            const breadcrumb = document.getElementById('breadcrumb');
            const title = document.getElementById('currentViewTitle');

            grid.innerHTML = "<p class='text-blue-600'>Fetching Chapters...</p>";
            breadcrumb.classList.remove('hidden');
            title.innerText = subjectID;

            try {
                const chapRef = collection(db, "classes", currentClass, "subjects", subjectID, "chapters");
                const snap = await getDocs(chapRef);

                grid.innerHTML = "";
                if (snap.empty) {
                    grid.innerHTML = "<p class='text-gray-500'>No chapters added yet.</p>";
                    return;
                }

                snap.forEach((doc) => {
                    const chap = doc.data();
                    grid.innerHTML += `
                        <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-500 hover:shadow-lg transition">
                            <h4 class="text-lg font-bold text-gray-800">${chap.title || doc.id}</h4>
                            <div class="flex flex-wrap gap-3 mt-4">
                                <button onclick="window.playVideo('${chap.videoLink}', '${chap.title}')" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg text-sm font-bold hover:bg-blue-700 transition">▶ Video</button>
                                ${chap.notesLink ? `<a href="${chap.notesLink}" target="_blank" class="flex-1 bg-orange-500 text-white py-2 px-4 rounded-lg text-sm font-bold text-center hover:bg-orange-600 transition">📄 Notes</a>` : ''}
                            </div>
                        </div>`;
                });
            } catch (error) {
                grid.innerHTML = "<p class='text-red-500'>Error loading chapters.</p>";
            }
        }

        // 5. Global Video Logic
        window.playVideo = function(link, title) {
            if (!link || link.includes("video link")) {
                alert("Iss chapter ki video abhi available nahi hai.");
                return;
            }

            let videoId = "";
            try {
                if (link.includes("v=")) {
                    videoId = link.split("v=")[1].split("&")[0];
                } else if (link.includes("youtu.be/")) {
                    videoId = link.split("youtu.be/")[1];
                }

                if (videoId) {
                    document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    document.getElementById('videoTitle').innerText = title;
                    document.getElementById('videoModal').classList.remove('hidden');
                } else {
                    alert("Invalid YouTube Link!");
                }
            } catch (e) {
                alert("Video player error.");
            }
        }

        // 6. UI Controls
        document.getElementById('backBtn').onclick = () => loadSubjects(currentClass);
        
        document.getElementById('closeVideoBtn').onclick = function() {
            document.getElementById('videoModal').classList.add('hidden');
            document.getElementById('videoFrame').src = "";
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        // 7. Razorpay Implementation
        document.getElementById('payNowBtn').onclick = function() {
            var options = {
                "key": "rzp_test_SZlBfxFaDKpW25",
                "amount": 49900,
                "name": "RDX Singh Academy",
                "description": "Subscription Fee",
                "handler": async function (response) {
                    const userRef = doc(db, "students", currentUser.uid);
                    await updateDoc(userRef, {
                        isPaid: true,
                        paymentID: response.razorpay_payment_id
                    });
                    alert("Success! Page reload ho raha hai...");
                    location.reload();
                },
                "prefill": { "email": currentUser.email },
                "theme": { "color": "#2563eb" }
            };
            var rzp1 = new Razorpay(options);
            rzp1.open();
        };
    </script>
</body>
</html>
