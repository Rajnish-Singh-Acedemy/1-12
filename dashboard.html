<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">RDX Singh Academy</h1>
        <button onclick="logout()" class="text-red-500 font-medium">Logout</button>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mb-6">
            <h2 class="text-2xl font-bold text-gray-800" id="welcomeMsg">Namaste Student!</h2>
            <p class="text-gray-500" id="courseInfo">Aapne <span class="font-bold text-blue-600" id="className">...</span> ke liye login kiya hai.</p>
        </div>

        <div id="mainSection" class="grid gap-6">
            <div id="loader" class="text-center py-10 text-gray-400">Loading your dashboard...</div>
            
            <div id="videoSection" class="hidden">
                <h3 class="text-lg font-bold mb-4">Aapki Classes</h3>
                <div class="aspect-video bg-black rounded-xl overflow-hidden shadow-lg">
                    <iframe id="courseVideo" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div id="paymentSection" class="hidden bg-blue-50 border border-blue-100 p-8 rounded-2xl text-center">
                <div class="mb-4 inline-block p-4 bg-blue-100 rounded-full">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800">Course Access Locked</h3>
                <p class="text-gray-600 mt-2 mb-6">Padhai shuru karne ke liye fees jama karein.</p>
                
                <button onclick="payWithRazorpay()" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold hover:bg-blue-700 transition transform hover:scale-105 shadow-lg">
                    Pay Fees & Unlock Course
                </button>

                <div class="mt-6 flex justify-center gap-6 grayscale opacity-60">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" class="h-6">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" class="h-6">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Visa_Logo_2021.svg" class="h-4">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dashboard Initialization
        const selectedCourse = sessionStorage.getItem('selectedCourse') || "General Course";
        document.getElementById('className').innerText = selectedCourse;

        // Firebase Auth & Firestore Logic
        // Dhyaan dein: Firebase SDK scripts is file se pehle load honi chahiye.
        auth.onAuthStateChanged((user) => {
            if (user) {
                db.collection("students").doc(user.uid).get().then((doc) => {
                    document.getElementById('loader').classList.add('hidden');
                    
                    if (doc.exists && doc.data().isPaid) {
                        showCourseContent();
                    } else {
                        document.getElementById('paymentSection').classList.remove('hidden');
                    }
                }).catch(err => console.error("Error fetching student data:", err));
            } else {
                window.location.href = "login.html";
            }
        });

        function showCourseContent() {
            document.getElementById('videoSection').classList.remove('hidden');
            document.getElementById('paymentSection').classList.add('hidden');
            // Yahan apna video ID badlein
            document.getElementById('courseVideo').src = "https://www.youtube.com/embed/YOUR_VIDEO_ID"; 
        }

        // --- Razorpay Payment Integration ---
        function payWithRazorpay() {
            const user = auth.currentUser;
            if (!user) return alert("Please login first!");

            const options = {
                "key": "rzp_test_SZMzAPsPFmvpes", // Aapki Test API Key
                "amount": 50000, // Rs 500 (Amount paise mein hota hai: 500 * 100)
                "currency": "INR",
                "name": "RDX Singh Academy",
                "description": "Fees for " + selectedCourse,
                "image": "https://your-logo-url.com/logo.png", // Optional: Academy Logo
                "handler": function (response) {
                    // Payment success hone par Firestore update karein
                    handlePaymentSuccess(response.razorpay_payment_id);
                },
                "prefill": {
                    "name": user.displayName || "Student",
                    "email": user.email || ""
                },
                "theme": {
                    "color": "#2563eb" // Blue color matching your theme
                }
            };

            const rzp1 = new Razorpay(options);
            
            rzp1.on('payment.failed', function (response){
                alert("Payment Failed: " + response.error.description);
            });

            rzp1.open();
        }

        // Firestore mein entry save karne ka function
        function handlePaymentSuccess(paymentId) {
            const userId = auth.currentUser.uid;
            
            db.collection("students").doc(userId).set({
                isPaid: true,
                razorpay_payment_id: paymentId,
                courseName: selectedCourse,
                paidAt: new Date().toISOString()
            }, { merge: true }).then(() => {
                alert("Payment Successful! Your course is now unlocked.");
                location.reload(); // Page refresh karke video dikhayega
            }).catch((error) => {
                console.error("Error updating Firestore:", error);
                alert("Payment successful but database update failed. Please contact support.");
            });
        }

        function logout() {
            auth.signOut().then(() => { window.location.href = "login.html"; });
        }

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

</script>
</body>
</html>
