<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="application/javascript" src="https://securegw-stage.paytm.in/merchantpgpui/checkoutjs/merchants/SqlJsT37090801680699.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">RDX Singh Academy</h1>
        <button onclick="logout()" class="text-red-500 font-medium">Logout</button>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mb-6">
            <h2 class="text-2xl font-bold text-gray-800" id="welcomeMsg">Namaste Student!</h2>
            <p class="text-gray-500" id="courseInfo">Aapne <span class="font-bold text-blue-600" id="className">...</span> ke liye login kiya hai.</p>
        </div>

        <div id="mainSection" class="grid gap-6">
            <div id="loader" class="text-center py-10 text-gray-400">Loading your dashboard...</div>
            
            <div id="videoSection" class="hidden">
                <h3 class="text-lg font-bold mb-4">Aapki Classes</h3>
                <div class="aspect-video bg-black rounded-xl overflow-hidden shadow-lg">
                    <iframe id="courseVideo" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div id="paymentSection" class="hidden bg-blue-50 border border-blue-100 p-8 rounded-2xl text-center">
                <div class="mb-4 inline-block p-4 bg-blue-100 rounded-full">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800">Course Access Locked</h3>
                <p class="text-gray-600 mt-2 mb-6">Padhai shuru karne ke liye fees jama karein.</p>
                
                <button onclick="openPaytmWidget()" id="paytmBtn" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold hover:bg-blue-700 transition transform hover:scale-105">
                    Pay with Paytm & Unlock Course
                </button>

                <div class="mt-4 flex justify-center gap-4 grayscale opacity-50">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" class="h-6">
                    <img src="https://staticproxy.paytm.com/gandalf/63035560_1.png" class="h-6" alt="Paytm"> 
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dashboard Config
        const selectedCourse = sessionStorage.getItem('selectedCourse') || "General Course";
        document.getElementById('className').innerText = selectedCourse;

        // Firebase Auth Logic
        auth.onAuthStateChanged((user) => {
            if (user) {
                db.collection("students").doc(user.uid).get().then((doc) => {
                    document.getElementById('loader').classList.add('hidden');
                    
                    if (doc.exists && doc.data().isPaid) {
                        showCourseContent();
                    } else {
                        document.getElementById('paymentSection').classList.remove('hidden');
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        function showCourseContent() {
            document.getElementById('videoSection').classList.remove('hidden');
            document.getElementById('courseVideo').src = "https://www.youtube.com/embed/YOUR_VIDEO_ID"; 
        }

        // --- Paytm Integration Logic ---
        
        async function openPaytmWidget() {
            const userId = auth.currentUser.uid;
            const orderId = "ORDERID_" + Date.now();
            const amount = "500.00"; // Amount in Rupees

            // NOTE: "txnToken" backend se hi generate hota hai security ke liye.
            // Agar aap Firebase use kar rahe hain, toh aapko ek 'Cloud Function' likhna hoga 
            // jo Paytm API ko call karke token de sake.
            
            // Abhi ke liye hum implementation structure dikha rahe hain:
            const config = {
                "root": "",
                "flow": "DEFAULT",
                "data": {
                    "orderId": orderId,
                    "token": "YOUR_GENERATED_TXN_TOKEN", // Ye token server se aayega
                    "tokenType": "TXN_TOKEN",
                    "amount": amount
                },
                "handler": {
                    "notifyMerchant": function(eventName, data) {
                        console.log("notifyMerchant event => ", eventName, data);
                    }
                }
            };

            if (window.Paytm && window.Paytm.CheckoutJS) {
                window.Paytm.CheckoutJS.init(config).then(function onSuccess() {
                    window.Paytm.CheckoutJS.invoke();
                }).catch(function onError(error) {
                    console.log("Paytm Error: ", error);
                });
            }
        }

        function logout() {
            auth.signOut().then(() => { window.location.href = "login.html"; });
        }
    </script>
</body>
</html>
