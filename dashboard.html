<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">RDX Singh Academy</h1>
        <button onclick="logout()" class="text-red-500 font-medium">Logout</button>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mb-6">
            <h2 class="text-2xl font-bold text-gray-800" id="welcomeMsg">Namaste Student!</h2>
            <p class="text-gray-500" id="courseInfo">Aapne <span class="font-bold text-blue-600" id="classNameDisplay">...</span> ke liye login kiya hai.</p>
        </div>

        <div id="subjectSection" class="hidden mb-10">
            <h3 class="text-lg font-bold mb-4 text-gray-700">Aapke Subjects:</h3>
            <div id="subjectsList" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                </div>
        </div>

        <div id="mainSection" class="grid gap-6">
            <div id="loader" class="text-center py-10 text-gray-500 flex flex-col items-center">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-2"></div>
                Account details check ho rahi hain...
            </div>
            
            <div id="videoSection" class="hidden">
                <h3 class="text-lg font-bold mb-4">Aapki Classes</h3>
                <div class="aspect-video bg-black rounded-xl overflow-hidden shadow-lg">
                    <iframe id="courseVideo" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div id="paymentSection" class="hidden bg-blue-50 border border-blue-100 p-8 rounded-2xl text-center">
                <div class="mb-4 inline-block p-4 bg-blue-100 rounded-full">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800">Course Access Locked</h3>
                <p class="text-gray-600 mt-2 mb-6">Padhai shuru karne ke liye fees jama karein.</p>
                <button onclick="payWithRazorpay()" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold hover:bg-blue-700 transition transform hover:scale-105 shadow-lg">
                    Pay Fees & Unlock Course
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoflPLOwZ6Ol8FgmCiIMx4Lgn-qSap4Ps",
            authDomain: "rdx-singh-acedemy.firebaseapp.com",
            projectId: "rdx-singh-acedemy",
            storageBucket: "rdx-singh-acedemy.firebasestorage.app",
            messagingSenderId: "833608207106",
            appId: "1:833608207106:web:88c09aee29ed5eff28101b"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Subjects Data
        const classSubjects = {
            "Class-1": ["Maths", "English", "Hindi", "EVS"],
            "Class-2": ["Maths", "English", "Hindi", "General Knowledge"],
            // Aap baki classes yahan add kar sakte hain
        };

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.collection("students").doc(user.uid).get().then((doc) => {
                    document.getElementById('loader').classList.add('hidden');
                    if (doc.exists) {
                        const data = doc.data();
                        const userClass = data.class || "General Course";
                        
                        document.getElementById('welcomeMsg').innerText = "Namaste " + (data.name || "Student") + "!";
                        document.getElementById('classNameDisplay').innerText = userClass;

                        // Subjects dikhayein
                        displaySubjects(userClass);

                        if (data.isPaid) {
                            showCourseContent();
                        } else {
                            document.getElementById('paymentSection').classList.remove('hidden');
                        }
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        function displaySubjects(className) {
            const list = document.getElementById('subjectsList');
            const section = document.getElementById('subjectSection');
            const subjects = classSubjects[className] || ["General Study"];
            
            list.innerHTML = ""; // Clear purana data
            subjects.forEach(sub => {
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center font-bold text-blue-600">
                        ${sub}
                    </div>
                `;
            });
            section.classList.remove('hidden');
        }

        function showCourseContent() {
            document.getElementById('videoSection').classList.remove('hidden');
            document.getElementById('paymentSection').classList.add('hidden');
            document.getElementById('courseVideo').src = "https://www.youtube.com/embed/dQw4w9WgXcQ"; 
        }

        function payWithRazorpay() {
            // ... (Aapka purana Razorpay code yahan rahega)
        }

        function logout() {
            auth.signOut().then(() => { window.location.href = "login.html"; });
        }

        <div id="contentDisplay" class="hidden mt-6 bg-white p-6 rounded-2xl shadow-md">
    <h3 id="chapterTitle" class="text-xl font-bold mb-4 text-blue-600">Chapter Title</h3>
    
    <div class="aspect-video bg-black rounded-xl overflow-hidden mb-6">
        <iframe id="videoPlayer" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="flex gap-4">
        <a id="notesLink" href="#" target="_blank" class="flex-1 bg-green-600 text-white text-center py-3 rounded-xl font-bold">
            Download Notes (PDF)
        </a>
        <button onclick="goBackToChapters()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold">
            Back to Chapters
        </button>
    </div>
</div>

        async function openChapter(className, subjectName, chapterID) {
    // Firebase se specific chapter ka data lena
    const doc = await db.collection("content")
                        .doc(className)
                        .collection("Subjects")
                        .doc(subjectName)
                        .collection("Chapters")
                        .doc(chapterID).get();

    if (doc.exists) {
        const data = doc.data();
        
        // UI Update karna
        document.getElementById('subjectSection').classList.add('hidden');
        document.getElementById('contentDisplay').classList.remove('hidden');
        
        document.getElementById('chapterTitle').innerText = data.title;
        document.getElementById('videoPlayer').src = data.videoUrl;
        document.getElementById('notesLink').href = data.notesUrl;
    }
}
    </script>
</body>
</html>
