<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <div class="max-w-md mx-auto text-center p-10 bg-white rounded-2xl shadow-xl mt-10">
        <h3 class="text-2xl font-bold mb-4">Complete Your Payment</h3>
        <p class="text-gray-600 mb-6">Scan QR & Pay ₹499 to activate your course.</p>
        
        <div class="bg-gray-100 w-56 h-56 mx-auto mb-6 flex items-center justify-center border-2 border-dashed border-blue-400 rounded-lg">
             <img src="YOUR_QR_IMAGE_LINK_HERE" alt="Payment QR" class="max-w-full">
        </div>

        <div class="space-y-4">
            <input type="text" id="utr" placeholder="Enter Transaction ID (UTR)" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="submitPayment()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">Submit Transaction ID</button>
        </div>
    </div>

    <script>
        function submitPayment() {
            const utr = document.getElementById('utr').value;
            if(utr.length < 6) {
                alert("Please enter a valid Transaction ID");
                return;
            }
            alert("Details Submitted! We will verify and activate your account within 24 hours.");
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
