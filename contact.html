<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-card:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-blue-800 text-white py-10 text-center">
        <h1 class="text-4xl font-bold">Contact Us</h1>
        <p class="mt-2 text-blue-100">RDX Singh Academy - Excellence in Education</p>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-12 grid grid-cols-1 md:grid-cols-2 gap-10">
        
        <div class="space-y-6">
            <h2 class="text-2xl font-bold text-gray-800 border-b-2 border-blue-600 pb-2">Get In Touch</h2>
            
            <div class="contact-card bg-white p-6 rounded-lg shadow-md flex items-start space-x-4">
                <div class="text-blue-600 text-2xl"><i class="fas fa-map-marker-alt"></i></div>
                <div>
                    <h3 class="font-bold text-lg">Address</h3>
                    <p class="text-gray-600">E-289, Sector - 15, Noida, Uttar Pradesh</p>
                </div>
            </div>

            <div class="contact-card bg-white p-6 rounded-lg shadow-md flex items-start space-x-4">
                <div class="text-green-600 text-2xl"><i class="fas fa-phone-alt"></i></div>
                <div>
                    <h3 class="font-bold text-lg">Phone & WhatsApp</h3>
                    <p class="text-gray-600">+91 9716406865</p>
                    <a href="https://wa.me/919716406865" target="_blank" class="inline-block mt-2 bg-green-500 text-white px-4 py-1 rounded-full text-sm hover:bg-green-600">
                        <i class="fab fa-whatsapp mr-1"></i> Chat on WhatsApp
                    </a>
                </div>
            </div>

            <div class="contact-card bg-white p-6 rounded-lg shadow-md flex items-start space-x-4">
                <div class="text-red-500 text-2xl"><i class="fas fa-envelope"></i></div>
                <div>
                    <h3 class="font-bold text-lg">Email ID</h3>
                    <p class="text-gray-600">rajnishsingh54@gmail.com</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-lg border-t-4 border-blue-600 overflow-hidden">
            <h2 class="text-xl font-bold text-gray-800 p-4 text-center bg-gray-50 border-b">Student Inquiry Form</h2>
            <div class="w-full" style="height: 650px;">
                <iframe 
                    src="https://script.google.com/macros/s/AKfycbwCVJ-zfIVdfmZSJA6XmnZAQs9x-wk_1N3JQHQrAI1z6HM-j2Gzqo0looiARl-yi6gq/exec" 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    marginheight="0" 
                    marginwidth="0">
                    Loading…
                </iframe>
            </div>
        </div>
    </div>

    <div class="w-full h-80 bg-gray-200 mt-10">
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3503.208154562514!2d77.3115469!3d28.5920367!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390ce4f63c631b79%3A0x289f67a6d8442e3f!2sE-289%2C%20Sector%2015%2C%20Noida%2C%20Uttar%20Pradesh%20201301!5e0!3m2!1sen!2sin!4v1710000000000" 
            width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
        </iframe>
    </div>

</body>
</html>
