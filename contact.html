<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-card:hover { transform: translateY(-5px); transition: 0.3s; }
        /* Iframe loading smoothly */
        iframe { background-color: #ffffff; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-blue-800 text-white py-10 text-center">
        <h1 class="text-4xl font-bold">Contact Us</h1>
        <p class="mt-2 text-blue-100">RDX Singh Academy - Excellence in Education</p>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-12 grid grid-cols-1 md:grid-cols-2 gap-10">
        
        <div class="space-y-6">
            <h2 class="text-2xl font-bold text-gray-800 border-b-2 border-blue-600 pb-2">Get In Touch</h2>
            
            <div class="contact-card bg-white p-6 rounded-lg shadow-md flex items-start space-x-4 border-l-4 border-blue-600">
                <div class="text-blue-600 text-2xl"><i class="fas fa-map-marker-alt"></i></div>
                <div>
                    <h3 class="font-bold text-lg text-gray-800">Address</h3>
                    <p class="text-gray-600">E-289, Sector - 15, Noida, Uttar Pradesh</p>
                </div>
            </div>

            <div class="contact-card bg-white p-6 rounded-lg shadow-md flex items-start space-x-4 border-l-4 border-green-500">
                <div class="text-green-600 text-2xl"><i class="fas fa-phone-alt"></i></div>
                <div>
                    <h3 class="font-bold text-lg text-gray-800">Phone & WhatsApp</h3>
                    <p class="text-gray-600">+91 9716406865</p>
                    <a href="https://wa.me/919716406865" target="_blank" class="inline-block mt-3 bg-green-500 text-white px-5 py-2 rounded-full text-sm font-semibold hover:bg-green-600 transition shadow-sm">
                        <i class="fab fa-whatsapp mr-1 text-lg"></i> Chat on WhatsApp
                    </a>
                </div>
            </div>

            <div class="contact-card bg-white p-6 rounded-lg shadow-md flex items-start space-x-4 border-l-4 border-red-500">
                <div class="text-red-500 text-2xl"><i class="fas fa-envelope"></i></div>
                <div>
                    <h3 class="font-bold text-lg text-gray-800">Email ID</h3>
                    <p class="text-gray-600">rajnishsingh54@gmail.com</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-xl border-t-4 border-blue-600 overflow-hidden">
            <div class="bg-gray-50 border-b p-4">
                <h2 class="text-xl font-bold text-gray-800 text-center italic">Student Inquiry Form</h2>
            </div>
            <div class="w-full" style="height: 650px;">
                <iframe 
                    src="https://script.google.com/macros/s/AKfycbx0o6KSdfwdUfawle4aI3CP_LuPLdQkaX5EVWaYx8Rj2cnaKAJH1ggkWyOi25aZa9v_/exec" 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    marginheight="0" 
                    marginwidth="0">
                    Loading…
                </iframe>
            </div>
        </div>
    </div>

    <div class="w-full h-80 bg-gray-200 mt-10 shadow-inner">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbykE1GeuGC9pvHsnUGoxnrX4gnbmNDEUkK4ja68iCVTzkn_L7wHjbk16KqgqVs8SA/exec" 
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

</body>
</html>
