<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-card:hover { transform: translateY(-5px); transition: 0.3s; }
        .loading-spinner { display: none; border: 3px solid #f3f3f3; border-top: 3px solid #1e40af; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-blue-800 text-white py-10 text-center">
        <h1 class="text-4xl font-bold">Contact Us</h1>
        <p class="mt-2 text-blue-100">RDX Singh Academy - Excellence in Education</p>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-12 grid grid-cols-1 md:grid-cols-2 gap-10">
        
        <div class="space-y-6">
            <h2 class="text-2xl font-bold text-gray-800 border-b-2 border-blue-600 pb-2">Get In Touch</h2>
            
            <div class="contact-card bg-white p-6 rounded-lg shadow-md flex items-start space-x-4 border-l-4 border-blue-600">
                <div class="text-blue-600 text-2xl"><i class="fas fa-map-marker-alt"></i></div>
                <div>
                    <h3 class="font-bold text-lg text-gray-800">Address</h3>
                    <p class="text-gray-600">E-289, Sector - 15, Noida, Uttar Pradesh</p>
                </div>
            </div>

            <div class="contact-card bg-white p-6 rounded-lg shadow-md flex items-start space-x-4 border-l-4 border-green-500">
                <div class="text-green-600 text-2xl"><i class="fas fa-phone-alt"></i></div>
                <div>
                    <h3 class="font-bold text-lg text-gray-800">Phone & WhatsApp</h3>
                    <p class="text-gray-600">+91 9716406865</p>
                    <a href="https://wa.me/919716406865" target="_blank" class="inline-block mt-3 bg-green-500 text-white px-5 py-2 rounded-full text-sm font-semibold hover:bg-green-600 transition shadow-sm">
                        <i class="fab fa-whatsapp mr-1 text-lg"></i> Chat on WhatsApp
                    </a>
                </div>
            </div>

            <div class="contact-card bg-white p-6 rounded-lg shadow-md flex items-start space-x-4 border-l-4 border-red-500">
                <div class="text-red-500 text-2xl"><i class="fas fa-envelope"></i></div>
                <div>
                    <h3 class="font-bold text-lg text-gray-800">Email ID</h3>
                    <p class="text-gray-600">rajnishsingh54@gmail.com</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-xl border-t-4 border-blue-600 overflow-hidden">
            <div class="bg-gray-50 border-b p-4 text-center">
                <h2 class="text-xl font-bold text-gray-800 italic">Student Inquiry Form</h2>
            </div>
            <form id="studentInquiryForm" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Student Name</label>
                    <input type="text" name="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Father's Name</label>
                    <input type="text" name="fname" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Date of Birth</label>
                        <input type="date" name="dob" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Mobile No</label>
                        <input type="tel" name="mobile" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Email ID</label>
                    <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Message/Query</label>
                    <textarea name="msg" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-blue-800 text-white py-3 rounded-lg font-bold hover:bg-blue-900 transition flex justify-center items-center space-x-2">
                    <span>Submit Inquiry</span>
                    <div id="loader" class="loading-spinner"></div>
                </button>
                <p id="responseMsg" class="text-center text-sm mt-2 hidden"></p>
            </form>
        </div>
    </div>

    <div class="w-full h-80 bg-gray-200 mt-10 shadow-inner">
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3502.571477742085!2d77.309068!3d28.582635!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390ce458d0000001%3A0x6b6c0e86b97666d6!2sSector%2015%2C%20Noida%2C%20Uttar%20Pradesh!5e0!3m2!1sen!2sin!4v1700000000000" 
            width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzjKhAi5D9x7jO6QTepRn0mzY-x6HpSOltQvRUrfXKCT21oU7b9RCMb-ks1Im7_ZYtH/exec';
        const form = document.getElementById('studentInquiryForm');
        const btn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const msg = document.getElementById('responseMsg');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.disabled = true;
            loader.style.display = 'block';
            msg.classList.remove('hidden', 'text-red-500', 'text-green-500');
            msg.innerText = "Sending your inquiry...";
            msg.classList.add('text-blue-600', 'block');

            // Form data prepare karna (Google Script ke liye)
            const formData = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    msg.innerText = "Success! Your inquiry has been sent.";
                    msg.classList.replace('text-blue-600', 'text-green-500');
                    form.reset();
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    msg.innerText = "Error! Something went wrong.";
                    msg.classList.replace('text-blue-600', 'text-red-500');
                })
                .finally(() => {
                    btn.disabled = false;
                    loader.style.display = 'none';
                    setTimeout(() => msg.classList.add('hidden'), 5000);
                });
        });
    </script>

</body>
</html>
