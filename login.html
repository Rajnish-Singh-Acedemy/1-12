<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50">

    <div class="max-w-md mx-auto my-12 bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
        <h2 class="text-3xl font-black text-blue-600 text-center mb-2">Student Signup</h2>
        <p class="text-center text-slate-500 mb-8 text-sm">Apna account banayein aur padhai shuru karein.</p>

        <form id="signupForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Full Name</label>
                <input type="text" id="userName" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Email ID</label>
                <input type="email" id="userEmail" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Create Password</label>
                <input type="password" id="userPass" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">
                Create Account & Proceed
            </button>
        </form>
        <p class="text-center mt-6 text-sm text-slate-500">Already have an account? <a href="login.html" class="text-blue-600 font-bold underline">Login</a></p>
    </div>
