<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | RDX Singh Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-50">

    <div class="max-w-md mx-auto my-12 bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
        <h2 class="text-3xl font-black text-blue-600 text-center mb-2">Student Registration</h2>
        <p class="text-center text-slate-500 mb-8 text-sm">Apni details bharein aur admission/payment karein.</p>

        <form id="signupForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Full Name</label>
                <input type="text" id="userName" required placeholder="Aapka Poora Naam" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Email ID</label>
                <input type="email" id="userEmail" required placeholder="example@gmail.com" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Select Class / Course</label>
                <select id="userClass" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                    <option value="">-- Select Class --</option>
                    <option value="Class 9th">Class 9th (₹500)</option>
                    <option value="Class 10th">Class 10th (₹500)</option>
                    <option value="Class 11th">Class 11th (₹800)</option>
                    <option value="Class 12th">Class 12th (₹800)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Create Password</label>
                <input type="password" id="userPass" required placeholder="••••••••" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">
                Register & Pay Now
            </button>
        </form>

        <p class="text-center mt-6 text-sm text-slate-500">Pehle se account hai? <a href="login.html" class="text-blue-600 font-bold underline">Login Karein</a></p>
    </div>

<script>
    // 1. Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCoflPLOwZ6Ol8FgmCiIMx4Lgn-qSap4Ps",
        authDomain: "rdx-singh-acedemy.firebaseapp.com",
        databaseURL: "https://rdx-singh-acedemy-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "rdx-singh-acedemy",
        storageBucket: "rdx-singh-acedemy.firebasestorage.app",
        messagingSenderId: "833608207106",
        appId: "1:833608207106:web:88c09aee29ed5eff28101b",
        measurementId: "G-EYWXXZBKBP"
    };

    // 2. Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 3. URL se default Class Parameter detect karna (agar pichhle page se aaye ho)
    const urlParams = new URLSearchParams(window.location.search);
    const paramClass = urlParams.get('class');
    if (paramClass) {
        const classSelect = document.getElementById('userClass');
        for (let option of classSelect.options) {
            if (option.value.toLowerCase().includes(paramClass.toLowerCase())) {
                option.selected = true;
                break;
            }
        }
    }

    // 4. Registration & Razorpay Integration Logic
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const originalText = submitBtn.innerText;
        
        const name = document.getElementById('userName').value;
        const email = document.getElementById('userEmail').value;
        const selectedClass = document.getElementById('userClass').value;
        const pass = document.getElementById('userPass').value;

        // Class ke hisab se fees set karna (Paisa Paise me hota hai: ₹500 = 50000 paise)
        let amountInPaise = 50000; // Default ₹500
        if (selectedClass === "Class 11th" || selectedClass === "Class 12th") {
            amountInPaise = 80000; // ₹800
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Creating Account...";

        try {
            // Step A: Firebase Auth me Student Create karna
            const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
            const user = userCredential.user;

            // Profile display name update karna
            await user.updateProfile({ displayName: name });

            submitBtn.innerText = "Opening Payment Gateway...";

            // Step B: Razorpay Options Config
            const options = {
                "key": "YOUR_RAZORPAY_KEY_ID", // Yahan apni Razorpay Live/Test Key ID daalein (e.g. rzp_test_xxxxx)
                "amount": amountInPaise, 
                "currency": "INR",
                "name": "RDX Singh Academy",
                "description": `Course Admission Fee - ${selectedClass}`,
                "image": "https://via.placeholder.com/150", // Aapki Academy ka logo URL
                "handler": async function (response) {
                    // Payment Successful hone par Firestore me details save karein
                    await db.collection("students").doc(user.uid).set({
                        uid: user.uid,
                        name: name,
                        email: email,
                        class: selectedClass,
                        paymentId: response.razorpay_payment_id,
                        paymentStatus: "Paid",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // Session storage me details save karein
                    sessionStorage.setItem('selectedCourse', selectedClass);
                    sessionStorage.setItem('userName', name);

                    alert("Registration & Payment Successful! Welcome to RDX Singh Academy.");
                    window.location.href = "dashboard.html";
                },
                "prefill": {
                    "name": name,
                    "email": email
                },
                "theme": {
                    "color": "#2563eb"
                },
                "modal": {
                    "ondismiss": function() {
                        submitBtn.disabled = false;
                        submitBtn.innerText = originalText;
                        alert("Payment cancel ho gayi hai. Dashboard access karne ke liye payment zaroori hai.");
                    }
                }
            };

            const rzp1 = new Razorpay(options);
            rzp1.open();

        } catch (error) {
            submitBtn.disabled = false;
            submitBtn.innerText = originalText;
            console.error("Signup Error:", error);

            if (error.code === 'auth/email-already-in-use') {
                alert("Ye Email ID pehle se registered hai! Kripya Login karein.");
            } else if (error.code === 'auth/weak-password') {
                alert("Password kam se kam 6 characters ka hona chahiye.");
            } else {
                alert("Error: " + error.message);
            }
        }
    });
</script>
</body>
</html>
